name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/validate.py --manifest data/v0.1/manifest.json
      - run: python3 tools/validate.py --manifest data/v1.0/manifest.json
      - run: python3 -m unittest discover -s tests
      - run: python3 tools/export_jsonl.py --output build/office-core-cb8.jsonl
      - run: python3 tools/export_jsonl.py --manifest data/v1.0/manifest.json --output build/realworld-prompt-kit-v1.jsonl
      - run: python3 tools/coverage_report.py
      - run: python3 tools/review_v1.py
      - name: Check public metadata hygiene
        run: |
          if rg -n '/Users/|source_thread_id|naturalistic_freeform' reports suites; then
            echo 'private or obsolete source metadata found in public artifacts' >&2
            exit 1
          fi
