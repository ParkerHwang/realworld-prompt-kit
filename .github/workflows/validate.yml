name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/validate.py
      - run: python3 -m unittest discover -s tests
      - run: python3 tools/export_jsonl.py --output build/realworld-prompt-kit.jsonl
      - run: python3 tools/coverage_report.py
      - run: python3 tools/review.py
      - name: Check one release root and exact export size
        run: |
          python3 -c 'from pathlib import Path; raise SystemExit((Path("data") / ("v" + "1.0")).exists())'
          test "$(find data -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = 1
          test "$(find data/v0.1/scenarios -type f -name '*.json' | wc -l | tr -d ' ')" = 880
          test "$(wc -l < build/realworld-prompt-kit.jsonl | tr -d ' ')" = 3520
      - name: Check public metadata hygiene
        run: |
          if rg -n '/Users/|source_thread_id|naturalistic_freeform' reports suites; then
            echo 'private or obsolete source metadata found in public artifacts' >&2
            exit 1
          fi
